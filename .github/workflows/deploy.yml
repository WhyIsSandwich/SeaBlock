name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run build

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/.vitepress/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Repository variables only: Settings → Secrets and variables → Actions → Variables.
    # (Environment-only variables are not reliable in job-level `if` before the environment resolves.)
    # DEPLOY_ON_ANY_PUSH must be exactly the string `true` (lowercase).
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (
        vars.DEPLOY_ON_ANY_PUSH == 'true' ||
        github.ref == format('refs/heads/{0}', vars.DEPLOY_BRANCH) ||
        (vars.DEPLOY_BRANCH == '' && github.ref == 'refs/heads/wiki')
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
